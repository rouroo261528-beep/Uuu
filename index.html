<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
* { margin: 0; padding: 0; }
body { background: #111; }
model-viewer {
  width: 100vw;
  height: 100vh;
  background-color: #111;
}
</style>
</head>
<body>
<model-viewer
  src="https://rouroo261528-beep.github.io/Uuu/07_06_2026.glb"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  loading="eager"
  reveal="auto">
</model-viewer>
</body>
</html>
